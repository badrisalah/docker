events {
}

http {
        # Tells NGINX what Content-Type to use for different file extensions
        include /etc/nginx/mime.types;
        server {
                # Accept HTTPS connections on port 443
                listen 443 ssl;
               # Domain handled by this server block
                server_name sabadri.42.fr;
                # TLS certificate and private key
                ssl_certificate /etc/nginx/ssl/inception.crt;
                ssl_certificate_key /etc/nginx/ssl/inception.key;
                # Only allow TLS 1.2 and TLS 1.3
                ssl_protocols TLSv1.2 TLSv1.3;
                # Location of the WordPress website files
                root /var/www/html;
                # Default file when requesting a directory
                index index.php index.html index.htm;
                # Handle normal HTTP requests
                location / {
                        try_files $uri $uri/ /index.php?$args;
                }
                # Handle PHP requests
                location ~ \.php$ {
                        include snippets/fastcgi-php.conf;
                        # Send PHP requests to the WordPress container
                        fastcgi_pass wordpress:9000;
                }
        }
}
